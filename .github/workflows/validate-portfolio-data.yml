name: HTML validation

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '404.html'
      - '.github/workflows/validate-portfolio-data.yml'
  pull_request:
    paths:
      - 'index.html'
      - '404.html'
      - '.github/workflows/validate-portfolio-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate markup
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate index.html and 404.html
        run: npx --yes html-validate@8 index.html 404.html
