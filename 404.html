<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<style>
  .nf { min-height: 70vh; display: grid; place-items: center; text-align: center; padding-block: 64px; }
  .nf h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.5rem, 6vw, 4rem); margin: 12px 0 16px; }
  .nf p { color: var(--text-2); max-width: 44ch; margin-inline: auto; }
  .nf .back { margin-top: 24px; }
</style>
</head>
<body>
<main class="nf wrap">
  <div>
    <p class="eyebrow">404</p>
    <h1>That page does not exist.</h1>
    <p>The address may have changed. Everything on this site lives on one page, so the home page is the best place to start.</p>
    <p class="back"><a class="btn btn-primary" href="/">Go to the home page</a></p>
  </div>
</main>
</body>
</html>
